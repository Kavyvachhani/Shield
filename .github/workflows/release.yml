name: Build Installers

# Tauri links against each platform's native webview, so installers must be
# built on the platform they target. A Windows .exe cannot be produced from
# macOS or Linux — this workflow is the supported way to get one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which installers to build'
        type: choice
        options:
          - windows
          - all
        default: windows

permissions:
  contents: write   # needed to attach installers to a release on tag builds

jobs:
  # A tag build produces the full set; a manual run defaults to Windows only,
  # so getting a fresh .exe does not wait on the macOS and Linux jobs.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        run: |
          windows='{"platform":"windows-latest","name":"windows","args":"--bundles nsis,msi"}'
          macos='{"platform":"macos-latest","name":"macos","args":"--target universal-apple-darwin --bundles dmg,app"}'
          linux='{"platform":"ubuntu-22.04","name":"linux","args":"--bundles deb,appimage"}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "windows" ]; then
            echo "include=[$windows]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$windows,$macos,$linux]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run test suite
        run: cargo test --workspace --locked

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # On a tag build, publish the installers to a GitHub Release so they
          # have a permanent download URL rather than expiring with the artifact.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SentinelVAPT {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      # A silent bundling failure would otherwise surface as a missing download
      # much later, so confirm the installers exist and report their sizes.
      - name: Verify Windows installers were produced
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse -Path target -Include *.exe, *.msi `
            | Where-Object { $_.FullName -match 'bundle' }
          if (-not $found) {
            Write-Error "No .exe or .msi was produced under target/**/bundle"
            exit 1
          }
          $found | ForEach-Object {
            "{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sentinelvapt-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
