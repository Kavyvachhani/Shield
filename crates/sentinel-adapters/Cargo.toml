[package]
name = "sentinel-adapters"
version = "0.4.0"
edition = "2021"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.38", features = ["full", "process"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
url = "2.5"
sha2 = { workspace = true }
tracing = "0.1"
# TLS certificate inspection for the built-in native check engine.
# rustls is pure Rust, so the Windows build needs no platform TLS toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
# OS keychain access — credentials are NEVER stored in DB, only fetched at scan-time
keyring = { version = "2.3", features = [] }
