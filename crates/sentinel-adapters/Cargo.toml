[package]
name = "sentinel-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.38", features = ["full", "process"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2.5"
sha2 = { workspace = true }
tracing = "0.1"
# OS keychain access — credentials are NEVER stored in DB, only fetched at scan-time
keyring = { version = "2.3", features = [] }
