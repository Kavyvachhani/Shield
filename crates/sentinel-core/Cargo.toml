[package]
name = "sentinel-core"
version = "0.4.3"
edition = "2021"
description = "Core domain logic, authorization gate, finding schema, scoring, and reporting engine for SentinelVAPT."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
# The authorization gate matches on parsed hosts, never on raw substrings.
url = "2.5"

[dev-dependencies]
sentinel-db = { path = "../sentinel-db" }
sentinel-adapters = { path = "../sentinel-adapters" }


